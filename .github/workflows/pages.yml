name: Deploy GitHub Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run test
      - name: Build production bundle
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://nkszihlrwbwystbbaadh.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_hkFTWF1D7kfkaT3aFPecWg_qumsEZ5i
          VITE_AI_ENDPOINT: https://nkszihlrwbwystbbaadh.supabase.co/functions/v1/ai-enhance
          VITE_MODERATION_ENDPOINT: https://nkszihlrwbwystbbaadh.supabase.co/functions/v1/cv-moderate
      - name: Verify SEO files in Pages artifact
        run: test -s dist/sitemap.xml && test -s dist/robots.txt
      - name: Include English template previews
        run: cp english-modern.webp english-professional.webp dist/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public SEO endpoints
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 6 --retry-all-errors --retry-delay 5 --output /tmp/sitemap.xml "${SITE_URL%/}/sitemap.xml"
          grep -Fq '<urlset' /tmp/sitemap.xml
          curl --fail --silent --show-error --location --retry 6 --retry-all-errors --retry-delay 5 --output /tmp/robots.txt "${SITE_URL%/}/robots.txt"
          grep -Fq 'Sitemap:' /tmp/robots.txt
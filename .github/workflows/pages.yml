name: Deploy GitHub Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - name: Verify production configuration
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_AI_ENDPOINT: ${{ secrets.VITE_AI_ENDPOINT }}
        run: |
          set -euo pipefail
          test -n "$VITE_SUPABASE_URL" || { echo "::error::Missing VITE_SUPABASE_URL"; exit 1; }
          test -n "$VITE_SUPABASE_ANON_KEY" || { echo "::error::Missing VITE_SUPABASE_ANON_KEY"; exit 1; }
          test -n "$VITE_AI_ENDPOINT" || { echo "::error::Missing VITE_AI_ENDPOINT"; exit 1; }
          case "$VITE_SUPABASE_URL" in https://*) ;; *) echo "::error::VITE_SUPABASE_URL must use HTTPS"; exit 1;; esac
          case "$VITE_AI_ENDPOINT" in https://*) ;; *) echo "::error::VITE_AI_ENDPOINT must use HTTPS"; exit 1;; esac
      - run: npm run coverage
      - run: npm run verify
      - run: npm run build -- --base=/mo-cv/
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_AI_ENDPOINT: ${{ secrets.VITE_AI_ENDPOINT }}
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke test deployed site
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          test -n "$SITE_URL"
          HTML="$(curl --fail --silent --show-error --location --retry 6 --retry-all-errors --retry-delay 5 "$SITE_URL")"
          printf '%s' "$HTML" | grep -Fq '<title>MO CV | صانع السيرة الذاتية الذكي</title>'
          ASSET_PATH="$(printf '%s' "$HTML" | grep -oE '/mo-cv/assets/[^"]+\.js' | head -n 1)"
          test -n "$ASSET_PATH"
          ORIGIN="$(printf '%s' "$SITE_URL" | sed -E 's#(https?://[^/]+).*#\1#')"
          curl --fail --silent --show-error --location --retry 3 "$ORIGIN$ASSET_PATH" >/dev/null
          MANIFEST="$(curl --fail --silent --show-error --location --retry 3 "${SITE_URL%/}/manifest.webmanifest")"
          printf '%s' "$MANIFEST" | grep -Fq '"start_url":"/mo-cv/"'
          printf '%s' "$MANIFEST" | grep -Fq '"scope":"/mo-cv/"'
          curl --fail --silent --show-error --location --retry 3 "${SITE_URL%/}/robots.txt" >/dev/null

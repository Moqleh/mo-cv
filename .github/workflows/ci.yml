name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run typecheck
      - run: npm run test
      - run: npm run coverage
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: E2E core resume flow
        run: npx playwright test -g "AI-disabled core flow"
      - name: E2E landing contact
        run: npx playwright test -g "landing contact"
      - name: E2E landing locale
        run: npx playwright test -g "landing language"
      - name: E2E landing legal
        run: npx playwright test -g "landing legal"
      - run: npm audit --audit-level=critical
